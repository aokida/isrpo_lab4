on:
  push
jobs:
  ubuntu_testing:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3
        - name: Rectangle
          if: success() || failure()
          run: 
            python -m unittest rectangle.py
        - name: Circle
          if: success() || failure()
          run: 
            python -m unittest circle.py
        - name: Square
          if: success() || failure()
          run: 
            python -m unittest square.py
        - name: Triangle
          if: success() || failure()
          run: 
            python -m unittest triangle.py
  windows_testing:
    runs-on: windows-latest
    steps:
        - uses: actions/checkout@v3
        - name: Rectangle
          if: success() || failure()
          run: 
            python -m unittest rectangle.py
        - name: Circle
          if: success() || failure()
          run: 
            python -m unittest circle.py
        - name: Square
          if: success() || failure()
          run: 
            python -m unittest square.py
        - name: Triangle
          if: success() || failure()
          run: 
            python -m unittest triangle.py
