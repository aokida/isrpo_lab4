on:
  push
jobs:
  ubuntu_testing:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3
        - name: Run unit tests
          run: |
            python -m unittest rectangle.py
            python -m unittest circle.py
            python -m unittest square.py
            python -m unittest triangle.py
  windows_testing:
    runs-on: windows-latest
    steps:
        - uses: actions/checkout@v3
        - name: Run unit tests
          run: |
            python -m unittest rectangle.py
            python -m unittest circle.py
            python -m unittest square.py
            python -m unittest triangle.py
