on:
  push
jobs:
  ubuntu_testing:
    runs-on: ubuntu-latest
    steps:
        - name: Run unit tests
          run: |
              python -m unittest discover -s "rectangle.py"
              python -m unittest discover -s "circle.py"
              python -m unittest discover -s "square.py"
              python -m unittest discover -s "triangle.py"
  windows_testing:
    runs-on: windoes-latest
    steps:
        - name: Run unit tests
          run: |
              python -m unittest rectangle.py
              python -m unittest circle.py
              python -m unittest square.py
              python -m unittest triangle.py
