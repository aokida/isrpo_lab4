on:
  push
jobs:
  ubuntu_testing:
    runs-on: ubuntu-latest
    steps:
        - name: Run unit tests
          run: |
              python ../../rectangle.py
              python ../../circle.py
              python ../../square.py
              python ../../triangle.py
  windows_testing:
    runs-on: windoes-latest
    steps:
        - name: Run unit tests
          run: |
              python -m unittest rectangle.py
              python -m unittest circle.py
              python -m unittest square.py
              python -m unittest triangle.py
